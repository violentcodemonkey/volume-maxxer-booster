<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volume Maxer &amp; Booster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/speaker.svg" alt="" width="40" height="40">
      <h1>Volume Maxer &amp; Booster</h1>
    </header>

    <div class="toggle-row">
      <label for="enabled">Audio boost</label>
      <input id="enabled" type="checkbox" role="switch" aria-describedby="status">
    </div>

    <div class="slider-row">
      <label for="volume">Volume</label>
      <output id="readout" for="volume" aria-live="polite">100%</output>
    </div>
    <input id="volume" type="range" min="0" max="200" step="1" value="100" aria-describedby="limit-warning status">

    <button id="reset" type="button">Reset to 100%</button>

    <p id="limit-warning" class="warning">Warning: louder playback can damage hearing or speakers. Maximum: 200%.</p>
    <p id="status" role="status" aria-live="polite">Off. Click the switch to enable.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
